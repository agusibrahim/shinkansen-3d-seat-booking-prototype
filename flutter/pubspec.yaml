name: kai_3d_seat_booking
description: "KAI 3D Seat Booking Prototype (100% Native Flutter Port with interactive_3d Filament/SceneKit)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  vector_math: ^2.1.4
  interactive_3d:
    path: packages/interactive_3d

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/models/
    - assets/images/trains/
    - assets/images/seat-classes/
    - assets/images/icons/
    - assets/images/app-icon/
